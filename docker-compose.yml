services:
  client:
    build: .
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      - VITE_SOCKET_SERVER_URL=http://server:3001

  server:
    build: .
    command: npm run server
    ports:
      - "3001:3001"
    environment:
      - CORS_ORIGIN=http://client:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
